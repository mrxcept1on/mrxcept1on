<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="980" viewBox="0 0 1000 980" role="img" aria-labelledby="title desc">
  <title id="title">Kali-style profile terminal</title>
  <desc id="desc">A terminal-inspired profile with student information, security interests, contact details, and GitHub contribution statistics.</desc>
  <rect width="1000" height="980" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="998" height="978" rx="13" fill="none" stroke="#30363d" stroke-width="2"/>
  <style>
    text { font-family: Hack, "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 17px; fill: #f0f3f6; }
    .rail { fill: #2f7df6; }
    .root { fill: #ff1f2d; font-weight: 700; }
    .path { fill: #f4f4f4; }
    .cmd { fill: #00b8b8; }
    .key { fill: #9ece6a; }
    .muted { fill: #9da7b3; }
  </style>

  <text x="34" y="45"><tspan class="rail">┌──(</tspan><tspan class="root">root㉿ptr-void</tspan><tspan class="rail">)-[</tspan><tspan class="path">~</tspan><tspan class="rail">]</tspan></text>
  <text x="34" y="73"><tspan class="rail">└─</tspan><tspan class="root">#</tspan><tspan> </tspan><tspan class="cmd">whoami</tspan></text>
  <text x="34" y="105">Fourth-year BSIT student at Cebu Institute of Technology – University.</text>
  <text x="34" y="133">I enjoy coding and exploring offensive security, including game hacking,</text>
  <text x="34" y="161">web security, penetration testing, and red-team labs.</text>

  <text x="34" y="211"><tspan class="rail">┌──(</tspan><tspan class="root">root㉿ptr-void</tspan><tspan class="rail">)-[</tspan><tspan class="path">~</tspan><tspan class="rail">]</tspan></text>
  <text x="34" y="239"><tspan class="rail">└─</tspan><tspan class="root">#</tspan><tspan> </tspan><tspan class="cmd">cat</tspan><tspan> /etc/student-release</tspan></text>
  <text x="34" y="273" class="key">INSTITUTION</text><text x="185" y="273">= "Cebu Institute of Technology – University"</text>
  <text x="34" y="301" class="key">PROGRAM</text><text x="185" y="301">= "Bachelor of Science in Information Technology"</text>
  <text x="34" y="329" class="key">YEAR</text><text x="185" y="329">= "4th Year"</text>
  <text x="34" y="357" class="key">AGE</text><text x="185" y="357">= "20"</text>
  <text x="34" y="385" class="key">STATUS</text><text x="185" y="385">= "Building, learning, and debugging"</text>

  <text x="34" y="435"><tspan class="rail">┌──(</tspan><tspan class="root">root㉿ptr-void</tspan><tspan class="rail">)-[</tspan><tspan class="path">~</tspan><tspan class="rail">]</tspan></text>
  <text x="34" y="463"><tspan class="rail">└─</tspan><tspan class="root">#</tspan><tspan> </tspan><tspan class="cmd">cat</tspan><tspan> /root/.spawn</tspan></text>
  <text x="34" y="495">09/11 — memorable seed, chaotic lore.</text>

  <text x="34" y="545"><tspan class="rail">┌──(</tspan><tspan class="root">root㉿ptr-void</tspan><tspan class="rail">)-[</tspan><tspan class="path">~/contact</tspan><tspan class="rail">]</tspan></text>
  <text x="34" y="573"><tspan class="rail">└─</tspan><tspan class="root">#</tspan><tspan> </tspan><tspan class="cmd">cat</tspan><tspan> emails.txt</tspan></text>
  <text x="34" y="607" class="key">personal</text><text x="185" y="607">jayyantiongzon123@gmail.com</text>
  <text x="34" y="635" class="key">institution</text><text x="185" y="635">jayyan.tiongzon@cit.edu</text>

  <text x="34" y="685"><tspan class="rail">┌──(</tspan><tspan class="root">root㉿ptr-void</tspan><tspan class="rail">)-[</tspan><tspan class="path">~</tspan><tspan class="rail">]</tspan></text>
  <text x="34" y="713"><tspan class="rail">└─</tspan><tspan class="root">#</tspan><tspan> </tspan><tspan class="cmd">github-stats</tspan><tspan> --summary</tspan></text>
  <text x="34" y="747" class="key">total contributions</text><text x="250" y="747">2,939  <tspan class="muted">(Apr 8 – Present)</tspan></text>
  <text x="34" y="775" class="key">current streak</text><text x="250" y="775">1 day  <tspan class="muted">(Aug 3)</tspan></text>
  <text x="34" y="803" class="key">longest streak</text><text x="250" y="803">16 days <tspan class="muted">(May 13 – May 28)</tspan></text>

  <text x="34" y="853"><tspan class="rail">┌──(</tspan><tspan class="root">root㉿ptr-void</tspan><tspan class="rail">)-[</tspan><tspan class="path">~</tspan><tspan class="rail">]</tspan></text>
  <text x="34" y="881"><tspan class="rail">└─</tspan><tspan class="root">#</tspan><tspan> </tspan><tspan class="cmd">systemctl</tspan><tspan> status curiosity</tspan></text>
  <text x="34" y="915"><tspan class="key">●</tspan><tspan> curiosity.service — Never stop learning</tspan></text>
  <text x="68" y="943"><tspan class="muted">Loaded:</tspan><tspan class="key"> loaded</tspan><tspan dx="45" class="muted">Active:</tspan><tspan class="key"> active (running)</tspan></text>
</svg>

